name: Build Android APK & iOS IPA

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      ios_bundle_id:
        description: 'Custom iOS Bundle Identifier (Optional, e.g. com.yourname.pho)'
        required: false
        default: ''

jobs:
  # =============================================================
  # Android Build Job (Ubuntu Runner)
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Set up Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '29.x'

      - name: Install Protoc & Mobile plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/go/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Android NDK & SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Initialize Gomobile
        run: |
          gomobile init

      - name: Build Go Embedded Server (AAR)
        run: |
          make server-aar

      - name: Fetch Flutter dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=./debug-info

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pho-android-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  # =============================================================
  # iOS Build Job (macOS Runner)
  # =============================================================
  build-ios:
    name: Build iOS IPA (Sideloading Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Set up Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '29.x'

      - name: Install Protoc & Mobile plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/go/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Initialize Gomobile
        run: |
          gomobile init

      - name: Build Go Embedded Server (iOS XCFramework)
        run: |
          make server-ios

      - name: Update iOS Bundle ID if specified
        if: ${{ github.event.inputs.ios_bundle_id != '' }}
        run: |
          NEW_BUNDLE_ID="${{ github.event.inputs.ios_bundle_id }}"
          echo "Updating Bundle ID to: $NEW_BUNDLE_ID"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.rhinelt.pho;/PRODUCT_BUNDLE_IDENTIFIER = ${NEW_BUNDLE_ID};/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Fetch Flutter dependencies
        run: |
          flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r pho-ios-unsigned.ipa Payload
          ls -lh pho-ios-unsigned.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: pho-ios-unsigned-ipa
          path: pho-ios-unsigned.ipa
          retention-days: 14
