name: Build Multi-Platform Releases (Android, iOS, Windows)

permissions:
  contents: write

on:
  # 1. 仅在推送版本标签时自动触发构建（如 git push origin v1.0.0）
  push:
    tags:
      - "v*"

  # 2. 支持在 GitHub Actions 页面手动按需触发
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build (选择构建的目标平台)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - windows
      ios_bundle_id:
        description: 'Custom iOS Bundle Identifier (Optional, e.g. com.yourname.pho)'
        required: false
        default: ''

jobs:
  # =============================================================
  # Android Build Job (Ubuntu Runner)
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Set up Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '29.x'

      - name: Install Protoc & Mobile plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/go/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Android NDK & SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Initialize Gomobile
        run: |
          gomobile init

      - name: Build Go Embedded Server (AAR)
        run: |
          make server-aar

      - name: Fetch Flutter dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=./debug-info

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pho-android-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

  # =============================================================
  # iOS Build Job (macOS Runner)
  # =============================================================
  build-ios:
    name: Build iOS IPA (Sideloading Unsigned)
    runs-on: macos-14
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Set up Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '29.x'

      - name: Install Protoc & Mobile plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/go/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Initialize Gomobile
        run: |
          gomobile init

      - name: Build Go Embedded Server (iOS XCFramework)
        run: |
          make server-ios

      - name: Update iOS Bundle ID if specified
        if: ${{ github.event.inputs.ios_bundle_id != '' }}
        run: |
          NEW_BUNDLE_ID="${{ github.event.inputs.ios_bundle_id }}"
          echo "Updating Bundle ID to: $NEW_BUNDLE_ID"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.rhinelt.pho;/PRODUCT_BUNDLE_IDENTIFIER = ${NEW_BUNDLE_ID};/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Fetch Flutter dependencies
        run: |
          flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r pho-ios-unsigned.ipa Payload
          ls -lh pho-ios-unsigned.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: pho-ios-unsigned-ipa
          path: pho-ios-unsigned.ipa
          retention-days: 14

      - name: Publish iOS IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pho-ios-unsigned.ipa
          generate_release_notes: true

  # =============================================================
  # Windows Build Job (Windows Runner)
  # =============================================================
  build-windows:
    name: Build Windows App (x64 Release)
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Set up Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '29.x'

      - name: Set up MinGW (for Go CGO DLL build)
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Install Protoc plugins
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/go/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Generate Protobuf stubs
        shell: bash
        run: |
          protoc -I. --go_out . --go_opt paths=source_relative \
            --go-grpc_out . --go-grpc_opt paths=source_relative \
            --dart_out=grpc:lib \
            proto/*.proto

      - name: Build Go Embedded Server (Windows C-Shared DLL & LIB)
        shell: bash
        run: |
          mkdir -p windows/lib
          CGO_ENABLED=1 go build -o windows/lib/run.dll -buildmode=c-shared ./server/clib
          # 清除 MSVC 不兼容的 complex.h 定义
          sed -i '/#include <complex.h>/d' windows/lib/run.h
          sed -i '/typedef _Fcomplex GoComplex64;/d' windows/lib/run.h
          sed -i '/typedef _Dcomplex GoComplex128;/d' windows/lib/run.h
          # 自动生成 .def 导出表定义文件
          cat << 'EOF' > windows/lib/run.def
          LIBRARY run.dll
          EXPORTS
              RunGrpcServer
          EOF
          # 生成 MSVC 链接器识别的 run.lib 导入库
          dlltool -d windows/lib/run.def -l windows/lib/run.lib -D run.dll
          ls -la windows/lib/

      - name: Enable Windows Desktop in Flutter
        run: |
          flutter config --enable-windows-desktop

      - name: Fetch Flutter dependencies
        run: |
          flutter pub get

      - name: Build Windows Release App
        run: |
          flutter build windows --release

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          Write-Host "Packaging from: $releaseDir"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "pho-windows-x64.zip" -Force
          Get-Item pho-windows-x64.zip | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pho-windows-x64-zip
          path: pho-windows-x64.zip
          retention-days: 14

      - name: Publish Windows ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pho-windows-x64.zip
          generate_release_notes: true
