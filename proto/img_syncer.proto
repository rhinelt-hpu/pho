syntax = "proto3";
package img_syncer;

option go_package = "github.com/fregie/img_syncer/proto";

service ImgSyncer {
  rpc SetDirectoryType (SetDirectoryTypeRequest) returns (SetDirectoryTypeResponse) {}
  rpc ListByDate (ListByDateRequest) returns (ListByDateResponse) {}
  rpc Delete (DeleteRequest) returns (DeleteResponse) {}
  rpc FilterNotUploaded (stream FilterNotUploadedRequest) returns (stream FilterNotUploadedResponse) {}
  // Album Management
  rpc ListAlbums (ListAlbumsRequest) returns (ListAlbumsResponse) {}
  rpc CreateAlbum (CreateAlbumRequest) returns (CreateAlbumResponse) {}
  rpc DeleteAlbum (DeleteAlbumRequest) returns (DeleteAlbumResponse) {}
  rpc RenameAlbum (RenameAlbumRequest) returns (RenameAlbumResponse) {}
  rpc MoveAssets (MoveAssetsRequest) returns (MoveAssetsResponse) {}
  // SAMBA Drive
  rpc SetDriveSMB (SetDriveSMBRequest) returns (SetDriveSMBResponse) {}
  rpc ListDriveSMBShares (ListDriveSMBSharesRequest) returns (ListDriveSMBSharesResponse) {}
  rpc ListDriveSMBDir (ListDriveSMBDirRequest) returns (ListDriveSMBDirResponse) {}
  rpc SetDriveSMBShare (SetDriveSMBShareRequest) returns (SetDriveSMBShareResponse) {}
  // Webdav Drive
  rpc SetDriveWebdav (SetDriveWebdavRequest) returns (SetDriveWebdavResponse) {}
  rpc ListDriveWebdavDir (ListDriveWebdavDirRequest) returns (ListDriveWebdavDirResponse) {}
  // NFS Drive
  rpc SetDriveNFS (SetDriveNFSRequest) returns (SetDriveNFSResponse) {}
  rpc ListDriveNFSDir (ListDriveNFSDirRequest) returns (ListDriveNFSDirResponse) {}
  // TODO(open-source): 补齐更多公有云盘后端 (待开源实现):
  // rpc SetDriveBaiduNetDisk (SetDriveBaiduNetDiskRequest) returns (SetDriveBaiduNetDiskResponse) {}
  // rpc StartBaiduNetdiskLogin (StartBaiduNetdiskLoginRequest) returns (StartBaiduNetdiskLoginResponse) {}
  // Ping
  rpc Ping (PingRequest) returns (PingResponse) {}
}

// enum ContentType {
//   IMAGE_JPEG = 0;
//   IMAGE_PNG = 1;
//   IMAGE_GIF = 2;
// }

enum DirectoryType {
  DIRECTORY_TYPE_01 = 0; // YYYY/MM/DD/photo_name.jpg
  DIRECTORY_TYPE_02 = 1; // YYYYMMDD/photo_name.jpg
}

message SetDirectoryTypeRequest {
  DirectoryType directoryType = 1;
}
message SetDirectoryTypeResponse {
  bool success = 1;
  string message = 2;
}

message FileInfo {
  string path = 1;
  int64 size = 2;
  bool isLivePhoto = 3;
}

message ListByDateRequest {
  string date = 1; // YYYY:MM:DD
  int32 offset = 2;
  int32 maxReturn = 3;
  string album = 4; // empty string means all albums (aggregated) or specific album name
}
message ListByDateResponse {
  bool success = 1;
  string message = 2;
  repeated FileInfo infos = 3;
}

message DeleteRequest {
  repeated string paths = 1;
}
message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message AlbumInfo {
  string name = 1;
  int64 count = 2;
  string coverPath = 3;
  bool isDefault = 4;
}

message ListAlbumsRequest {}
message ListAlbumsResponse {
  bool success = 1;
  string message = 2;
  repeated AlbumInfo albums = 3;
}

message CreateAlbumRequest {
  string name = 1;
}
message CreateAlbumResponse {
  bool success = 1;
  string message = 2;
}

message DeleteAlbumRequest {
  string name = 1;
}
message DeleteAlbumResponse {
  bool success = 1;
  string message = 2;
}

message RenameAlbumRequest {
  string oldName = 1;
  string newName = 2;
}
message RenameAlbumResponse {
  bool success = 1;
  string message = 2;
}

message MoveAssetsRequest {
  repeated string paths = 1;
  string targetAlbum = 2;
}
message MoveAssetsResponse {
  bool success = 1;
  string message = 2;
  repeated string newPaths = 3;
}

message FilterNotUploadedRequestInfo {
  string name = 1;
  string date = 2;
  string id = 3;
}

message FilterNotUploadedRequest {
  repeated FilterNotUploadedRequestInfo photos = 1;
  bool isFinished = 2;
}
message FilterNotUploadedResponse {
  bool success = 1;
  string message = 2;
  repeated string notUploaedIDs = 3;
  repeated string uploadedIDs = 4;
  bool isFinished = 5;
  repeated string invalid_ids = 6;
  repeated string notUploadedIDs = 7;
}

message SetDriveSMBRequest {
  string addr = 1;
  string username = 2;
  string password = 3;
  string share = 4;
  string root = 5;
}
message SetDriveSMBResponse {
  bool success = 1;
  string message = 2;
}

message ListDriveSMBSharesRequest {}
message ListDriveSMBSharesResponse {
  bool success = 1;
  string message = 2;
  repeated string shares = 3;
}

message ListDriveSMBDirRequest {
  string share = 1;
  string dir = 2;
}
message ListDriveSMBDirResponse {
  bool success = 1;
  string message = 2;
  repeated string dirs = 3;
}

message SetDriveSMBShareRequest {
  string share = 1;
  string root = 2;
}
message SetDriveSMBShareResponse {
  bool success = 1;
  string message = 2;
}

message SetDriveWebdavRequest {
  string addr = 1;
  string username = 2;
  string password = 3;
  string root = 4;
  bool insecure = 5;
}
message SetDriveWebdavResponse {
  bool success = 1;
  string message = 2;
}

message ListDriveWebdavDirRequest {
  string dir = 1;
}
message ListDriveWebdavDirResponse {
  bool success = 1;
  string message = 2;
  repeated string dirs = 3;
}

message SetDriveNFSRequest {
  string addr = 1;
  string root = 2;
}
message SetDriveNFSResponse {
  bool success = 1;
  string message = 2;
}

message ListDriveNFSDirRequest {
  string dir = 1;
}
message ListDriveNFSDirResponse {
  bool success = 1;
  string message = 2;
  repeated string dirs = 3;
}

message PingRequest {}

message PingResponse {
  int64 server_start_time = 1;
  int64 uptime_seconds = 2;
}